name: Build plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar
        run: |
          POM=$(find . -name pom.xml | head -n 1)
          echo "Usando $POM"
          mvn -B package -f "$POM"

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: Mimic-jar
          path: "**/target/Mimic-*.jar"
