# Generado por build_pack.py - cada criatura se compone de PARTES animadas por el plugin.
# partes: modelo (custom_model_data) | rol (animacion) | pivote [x,y,z] en unidades de modelo (16 = 1 bloque)
# roles: cuerpo, cabeza, pata_a/pata_b (diagonales), pata_s (a la vez), cola, oreja_l/r, aleta_l/r

# true = tu no ves tu propio modelo. false = lo ves (en F5 / tercera persona)
ocultar-a-si-mismo: true
# La cabeza gira hacia donde miras (true) o queda fija (false)
cabeza-sigue: true

# Nick encima de la criatura (lo ven los demas, tu no)
nick:
  mostrar: true
  ocultar-vanilla: true   # oculta el nick normal para no verlo duplicado (usa un equipo temporal)

# escala: tamano del modelo | escala-jugador: tamano real del jugador (hitbox/camara)
# velocidad: multiplicador | amplitud: grados de balanceo de patas | salta: avanza a saltitos
# giro: grados para orientar el modelo (180 si se ve al reves) | balanceo: inclinacion lateral al andar
